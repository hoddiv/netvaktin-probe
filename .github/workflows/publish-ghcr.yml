name: Publish GHCR Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/netvaktin-probe
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Validate published digest image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/netvaktin-probe
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}@${PUBLISHED_DIGEST}"
          docker run --rm --entrypoint sh "${IMAGE_NAME}@${PUBLISHED_DIGEST}" -c 'grep -q "ZBX_TLSPSKVALUE" /usr/bin/entrypoint.sh && grep -q "TLSPSKFile" /usr/bin/entrypoint.sh && grep -q "TLS PSK file ready" /usr/bin/entrypoint.sh'

      - name: Validate published latest image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/netvaktin-probe:latest
        run: |
          set -euo pipefail
          docker pull "${IMAGE_NAME}"
          docker run --rm --entrypoint sh "${IMAGE_NAME}" -c 'grep -q "ZBX_TLSPSKVALUE" /usr/bin/entrypoint.sh && grep -q "TLSPSKFile" /usr/bin/entrypoint.sh && grep -q "TLS PSK file ready" /usr/bin/entrypoint.sh'
